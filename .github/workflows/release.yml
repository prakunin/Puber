name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to publish, for example v1.2.0'
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    env:
      RELEASE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_REF }}

      - name: Assert GitHub-hosted runner
        run: test "${RUNNER_ENVIRONMENT:-github-hosted}" = github-hosted

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testProdDebugUnitTest

  release:
    name: Build & Publish
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_REF }}

      - name: Assert GitHub-hosted runner
        run: test "${RUNNER_ENVIRONMENT:-github-hosted}" = github-hosted

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - run: chmod +x gradlew

      - name: Validate release secrets
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STOREPASS: ${{ secrets.STOREPASS }}
          KEYALIAS: ${{ secrets.KEYALIAS }}
          PUBER_CLIENT_SECRET: ${{ secrets.PUBER_CLIENT_SECRET }}
          TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
        run: |
          missing=()
          for name in RELEASE_KEYSTORE_BASE64 STOREPASS KEYALIAS PUBER_CLIENT_SECRET TMDB_READ_ACCESS_TOKEN; do
            if [[ -z "${!name}" ]]; then
              missing+=("$name")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required GitHub Secrets:\n' >&2
            printf '  - %s\n' "${missing[@]}" >&2
            exit 1
          fi

      - name: Build release APK
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STOREPASS: ${{ secrets.STOREPASS }}
          KEYALIAS: ${{ secrets.KEYALIAS }}
          KEYPASS: ${{ secrets.KEYPASS }}
          PUBER_CLIENT_SECRET: ${{ secrets.PUBER_CLIENT_SECRET }}
          TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
        run: ./gradlew assembleProdRelease

      - name: Check out the signer verifier from the workflow revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          sparse-checkout: tools/verify-apk-signer.sh
          sparse-checkout-cone-mode: false
          path: signer-verifier

      - name: Verify release signer
        env:
          RELEASE_CERT_SHA256: 7431d0e642edd29fc633fed6d529decab17e7b8dc1e40a75f880a07745baf2c6
        run: bash signer-verifier/tools/verify-apk-signer.sh app/build/outputs/apk/prod/release "$RELEASE_CERT_SHA256"

      - name: Prepare release artifacts
        run: |
          mkdir -p release-artifacts
          apk_path="$(find app/build/outputs/apk/prod/release -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          if [[ -z "$apk_path" ]]; then
            echo "Release APK was not produced" >&2
            exit 1
          fi

          cp "$apk_path" "release-artifacts/puber-${RELEASE_TAG}.apk"
          (
            cd release-artifacts
            shasum -a 256 "puber-${RELEASE_TAG}.apk" > "puber-${RELEASE_TAG}.apk.sha256"
          )

      - name: Upload APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: puber-${{ env.RELEASE_TAG }}
          path: release-artifacts/*
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Puber ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: release-artifacts/*
